<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Видео Куб (Вращение)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    #tap-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
      border-radius: 20px; font-family: sans-serif; font-size: 14px;
      z-index: 1000; pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>
  <div id="tap-hint">Коснитесь экрана для запуска видео.<br>Зажмите и двигайте палец/мышь, чтобы крутить куб.</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <video id="vid1" src="1.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="vid2" src="2.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="vid3" src="3.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="vid4" src="4.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="vid5" src="5.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="vid6" src="6.mp4" loop autoplay muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-marker preset="hiro">
      
      <!-- Контейнер для куба -->
      <a-entity id="cube-container">
        <a-video src="#vid1" position="0 0 0.5" rotation="0 0 0" width="1" height="1"></a-video>
        <a-video src="#vid2" position="0 0 -0.5" rotation="0 180 0" width="1" height="1"></a-video>
        <a-video src="#vid3" position="0.5 0 0" rotation="0 90 0" width="1" height="1"></a-video>
        <a-video src="#vid4" position="-0.5 0 0" rotation="0 -90 0" width="1" height="1"></a-video>
        <a-video src="#vid5" position="0 0.5 0" rotation="-90 0 0" width="1" height="1"></a-video>
        <a-video src="#vid6" position="0 -0.5 0" rotation="90 0 0" width="1" height="1"></a-video>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

    <script>
    // --- 1. ЗАПУСК ВИДЕО ---
    let videoStarted = false;
    function startVideos() {
      if (videoStarted) return;
      videoStarted = true;
      document.querySelectorAll('video').forEach(video => {
        video.play().catch(e => console.log('Видео не запустилось:', e));
      });
      document.getElementById('tap-hint').innerText = "Крутите куб пальцем!";
    }
    
    document.addEventListener('touchstart', startVideos, { once: true, passive: false });
    document.addEventListener('mousedown', startVideos, { once: true });

    // --- 2. ЛОГИКА ВРАЩЕНИЯ ---
    document.querySelector('a-scene').addEventListener('loaded', () => {
      const cube = document.getElementById('cube-container');
      if (!cube) {
        console.error("Куб не найден!");
        return;
      }

      let isDragging = false;
      let previousPos = { x: 0, y: 0 };
      let currentRotation = { x: 0, y: 0 };

      // Общая функция начала движения
      function onStart(x, y) {
        isDragging = true;
        previousPos = { x: x, y: y };
      }

      // Общая функция движения (с настройкой инверсии)
      function onMove(x, y, isTouch) {
        if (!isDragging) return;

        const deltaX = x - previousPos.x;
        const deltaY = y - previousPos.y;

        // Коэффициент скорости
        const speed = 0.5;

        // ЛОГИКА ИНВЕРСИИ:
        // На десктопе (мышь) ось Y инвертирована (палец вверх = куб вверх)
        // На мобилках (тач) часто нужно наоборот, поэтому делаем проверку
        const invertX = isTouch ? 1 : 1; 
        const invertY = isTouch ? -1 : 1; // Для тача инвертируем Y обратно

        currentRotation.y += deltaX * speed * invertX;
        currentRotation.x += deltaY * speed * invertY;

        cube.setAttribute('rotation', {
          x: currentRotation.x,
          y: currentRotation.y,
          z: 0
        });

        previousPos = { x: x, y: y };
      }

      function onEnd() {
        isDragging = false;
      }

      // --- СОБЫТИЯ МЫШИ (ПК) ---
      window.addEventListener('mousedown', (e) => {
        if (e.target.id === 'tap-hint') return;
        onStart(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) e.preventDefault();
        onMove(e.clientX, e.clientY, false); // false = это мышь
      });

      window.addEventListener('mouseup', onEnd);

      // --- СОБЫТИЯ КАСАНИЙ (ТЕЛЕФОН) ---
      window.addEventListener('touchstart', (e) => {
        if (e.target.id === 'tap-hint') return;
        // Берем первый палец
        onStart(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault(); // Останавливаем скролл страницы
        
        // Берем первый палец
        onMove(e.touches[0].clientX, e.touches[0].clientY, true); // true = это тач
      }, { passive: false });

      window.addEventListener('touchend', onEnd);
    });
  </script>
</body>
</html>
