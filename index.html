<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Галерея Кубов</title>
  
  <script src="aframe.min.js"></script>
  <script src="aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 2000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.3s;
    }
    #menu h1 { color: white; margin-bottom: 20px; font-size: 24px; text-align: center; }
    .buttons-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
      width: 90%; max-width: 400px;
    }
    .btn {
      padding: 15px; font-size: 18px; font-weight: bold; color: white;
      background: linear-gradient(135deg, #00e0ff, #7b2cff);
      border: none; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,224,255,0.3);
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    
    #back-btn {
      position: fixed; top: 20px; left: 20px; z-index: 1000;
      padding: 10px 20px; background: rgba(0,0,0,0.7); color: white;
      border: 1px solid white; border-radius: 20px; font-size: 16px;
      display: none; cursor: pointer;
    }
    
    #tap-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
      border-radius: 20px; font-size: 14px; z-index: 1000;
      pointer-events: none; text-align: center; display: none;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>Выберите AR-куб</h1>
    <div class="buttons-grid" id="buttons-container"></div>
  </div>

  <button id="back-btn">← В меню</button>
  <div id="tap-hint">Коснитесь экрана для запуска видео.<br>Крутите куб пальцем.</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true;">
    
    <a-assets>
      <!-- 
        МЫ ИСПОЛЬЗУЕМ ТОЛЬКО 6 ВИДЕОЭЛЕМЕНТОВ НА ВСЮ СЦЕНУ.
        Их src мы будем менять на лету в зависимости от выбранного куба.
      -->
      <video id="v1" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="v2" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="v3" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="v4" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="v5" loop autoplay muted playsinline crossorigin="anonymous"></video>
      <video id="v6" loop autoplay muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-marker preset="hiro">
      
      <!-- ЕДИНСТВЕННЫЙ КУБ -->
      <a-entity id="main-cube" visible="false">
        <a-video src="#v1" position="0 0 0.5" rotation="0 0 0" width="1" height="1"></a-video>
        <a-video src="#v2" position="0 0 -0.5" rotation="0 180 0" width="1" height="1"></a-video>
        <a-video src="#v3" position="0.5 0 0" rotation="0 90 0" width="1" height="1"></a-video>
        <a-video src="#v4" position="-0.5 0 0" rotation="0 -90 0" width="1" height="1"></a-video>
        <a-video src="#v5" position="0 0.5 0" rotation="-90 0 0" width="1" height="1"></a-video>
        <a-video src="#v6" position="0 -0.5 0" rotation="90 0 0" width="1" height="1"></a-video>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // --- 1. НАСТРОЙКИ КУБОВ ---
    // ВАЖНО: Здесь вы указываете, какие видео принадлежат какому кубу.
    // Просто замените "cube1_1.mp4" на реальные имена ваших файлов.
    const cubeData = {
      1: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      2: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      3: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      4: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      5: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      6: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      7: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      8: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      9: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"],
      10: ["1.mp4", "2.mp4", "3.mp4", "4.mp4", "5.mp4", "6.mp4"]
    };

    // --- 2. ГЕНЕРАЦИЯ КНОПОК ---
    const menu = document.getElementById('menu');
    const buttonsContainer = document.getElementById('buttons-container');
    const backBtn = document.getElementById('back-btn');
    const hint = document.getElementById('tap-hint');
    const mainCube = document.getElementById('main-cube');

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = `Куб ${i}`;
      btn.onclick = () => selectCube(i);
      buttonsContainer.appendChild(btn);
    }

    // --- 3. ЛОГИКА ВЫБОРА ---
    let activeCubeId = null;
    let videoStarted = false;

    function selectCube(id) {
      menu.style.opacity = '0';
      setTimeout(() => menu.style.display = 'none', 300);
      
      backBtn.style.display = 'block';
      hint.style.display = 'block';

      // Показываем куб
      mainCube.setAttribute('visible', 'true');
      
      // Подготавливаем видео
      loadVideosForCube(id);
      
      activeCubeId = id;
      videoStarted = false; // Сбрасываем, чтобы видео запустились
    }

    backBtn.onclick = () => {
      menu.style.display = 'flex';
      setTimeout(() => menu.style.opacity = '1', 10);
      backBtn.style.display = 'none';
      hint.style.display = 'none';
      
      // Прячем куб
      mainCube.setAttribute('visible', 'false');
      
      // Полностью останавливаем и очищаем видео
      document.querySelectorAll('video').forEach(v => {
        v.pause();
        v.removeAttribute('src'); // Очищаем память
        v.load(); 
      });
      
      activeCubeId = null;
      videoStarted = false;
    };

    // --- 4. ЗАГРУЗКА ВИДЕО ДЛЯ КУБА ---
    function loadVideosForCube(cubeId) {
      const videos = cubeData[cubeId];
      if (!videos) return;

      // Проходим по всем 6 видеоэлементам и меняем им источник
      for (let i = 1; i <= 6; i++) {
        const videoEl = document.getElementById(`v${i}`);
        videoEl.src = videos[i - 1];
        // Загружаем новые метаданные
        videoEl.load(); 
      }
    }

    // --- 5. ЗАПУСК ВИДЕО ---
    function startVideos() {
      if (videoStarted || !activeCubeId) return;
      videoStarted = true;
      
      document.querySelectorAll('video').forEach(video => {
        video.play().catch(e => console.log('Видео не запустилось:', e));
      });
    }

    document.addEventListener('touchstart', startVideos, { passive: true });
    document.addEventListener('mousedown', startVideos);

    // --- 6. ЛОГИКА ВРАЩЕНИЯ ---
    document.querySelector('a-scene').addEventListener('loaded', () => {
      let isDragging = false;
      let previousPos = { x: 0, y: 0 };
      
      // Храним вращение только для одного куба
      const currentQuat = new THREE.Quaternion();
      const tempQuat = new THREE.Quaternion();

      function onStart(x, y) {
        if (!activeCubeId) return;
        isDragging = true;
        previousPos = { x: x, y: y };
      }

      function onMove(x, y, isTouch) {
        if (!isDragging || !activeCubeId) return;

        const deltaX = x - previousPos.x;
        const deltaY = y - previousPos.y;
        const speed = 0.005;

        const invertX = isTouch ? -1 : 1; 
        const invertY = isTouch ? 1 : -1; 

        tempQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * speed * invertX);
        currentQuat.premultiply(tempQuat);

        tempQuat.setFromAxisAngle(new THREE.Vector3(1, 0, 0), deltaY * speed * invertY);
        currentQuat.premultiply(tempQuat);

        if (mainCube.object3D) {
          mainCube.object3D.quaternion.copy(currentQuat);
        }

        previousPos = { x: x, y: y };
      }

      function onEnd() {
        isDragging = false;
      }

      window.addEventListener('mousedown', (e) => {
        if (e.target.id === 'tap-hint' || e.target.className === 'btn') return;
        onStart(e.clientX, e.clientY);
      });
      window.addEventListener('mousemove', (e) => {
        if (isDragging) e.preventDefault();
        onMove(e.clientX, e.clientY, false);
      });
      window.addEventListener('mouseup', onEnd);

      window.addEventListener('touchstart', (e) => {
        if (e.target.id === 'tap-hint' || e.target.className === 'btn') return;
        onStart(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        onMove(e.touches[0].clientX, e.touches[0].clientY, true);
      }, { passive: false });
      window.addEventListener('touchend', onEnd);
    });
  </script>
</body>
</html>
